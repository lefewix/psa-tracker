<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <!-- FLXTCG PSA tracker mark: a graded slab. Violet shell + card (site accent
       #8b5cf6), gold geometric "10" on the label (the slab-gold grade accent).
       Mid-tone colors so the same file reads on dark and light themes.
       Lives at /opt/psa-tracker/logo.svg on the box, served at /logo. -->
  <g fill="none" stroke="#8b5cf6" stroke-width="7">
    <rect x="4" y="4" width="88" height="120" rx="18"/>
    <path d="M7 42h82" stroke-width="5"/>
    <rect x="27" y="56" width="42" height="53" rx="7" stroke-width="5.5"/>
  </g>
  <g fill="none" stroke="#f5b73d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33.5 21 38 17.5V31"/>
    <ellipse cx="55" cy="24" rx="7.2" ry="8.8"/>
  </g>
  <circle cx="48" cy="82.5" r="4.5" fill="#8b5cf6"/>
</svg>
